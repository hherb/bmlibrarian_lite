name: Python tests

permissions:
  contents: read

# Deliberately NOT filtered by `paths:`.
#
# The transparency parity fixtures live in doc/cross_platform/transparency_parity/,
# outside both src/ and tests/, and their entire purpose is to fail when a pattern
# change is not mirrored across Python, Swift and Kotlin. A paths filter listing
# the obvious source directories would skip this run for a contract-only edit —
# exactly the silent pass that the `inputs.dir` declaration in the Android
# app/build.gradle.kts exists to prevent (see HANDOVER.md). Running the suite on
# every change costs a couple of minutes and removes the whole class of problem.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # PySide6 widget tests construct a real QApplication; there is no display on
  # the runner, so Qt renders to an offscreen surface instead.
  QT_QPA_PLATFORM: offscreen
  # Chromium's sandbox inside QtWebEngine needs unprivileged user namespaces,
  # which the Ubuntu 24.04 runner's AppArmor forbids. CI only: the
  # application keeps its sandbox (#480, stage 2).
  QTWEBENGINE_DISABLE_SANDBOX: "1"

jobs:
  tests:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    # The suite finishes in about a minute; without a limit a hung test would
    # hold the runner for GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        # PySide6 wheels ship Qt itself but still link against the system
        # graphics and input stack, even for the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2t64 libgbm1 libxshmfence1 libxi6 libxcursor1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the project
        run: uv pip install --system -e ".[dev]"

      - name: Verify the GUI stack really works
        # The widget suites open with pytest.importorskip("PySide6"), so a
        # broken or missing Qt install would silently skip ~100 tests and leave
        # this job green. Constructing a QApplication here turns that into a
        # loud failure, and it checks the same thing the tests need rather than
        # just that the package imports. QtWebEngine included.
        run: python .github/scripts/qt_preflight.py

      - name: Run tests
        # Integration tests are deselected: they call Europe PMC and PubMed over
        # the network, so on CI they measure those services' availability rather
        # than this repository. --strict-markers makes a mistyped marker an error
        # instead of a silently-ignored no-op.
        run: pytest tests/ -m "not integration" --strict-markers

      # The ledger check runs after the tests, and whether or not they passed,
      # so a ledger miss never hides the test results and a test failure never
      # hides a ledger miss.
      - name: Read the ledger's bmlib commit
        # The ledger holds the full SHA (tests/test_bmlib_ledger.py pins its
        # shape), which actions/checkout requires of a commit ref, so bumping
        # it there is how a sync starts and nothing resolves it.
        if: ${{ !cancelled() }}
        id: bmlib_commit
        run: |
          echo "sha=$(python -c "import json; print(json.load(open('doc/cross_platform/bmlib_sync/ledger.json'))['bmlib_commit'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        # hherb/bmlib is public, so no token beyond the job's own is needed.
        if: ${{ !cancelled() }}
        with:
          repository: hherb/bmlib
          ref: ${{ steps.bmlib_commit.outputs.sha }}
          path: bmlib-checkout

      - name: Every bmlib change has a ledger entry
        if: ${{ !cancelled() }}
        run: python scripts/check_bmlib_ledger.py --bmlib bmlib-checkout

  lint-delta:
    name: No new ruff or mypy findings
    # Pull requests only. On a push to master the merge base is the commit
    # itself, so the comparison would be vacuously empty rather than meaningful.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Two full ruff+mypy runs take a few minutes; anything longer is a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate checks out the merge base in a worktree; a shallow clone
          # cannot resolve it, and the script fails rather than skipping.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the project
        # mypy needs the project's dependencies installed to resolve their types.
        run: uv pip install --system -e ".[dev]"

      - name: Fetch the base branch
        run: git fetch --no-tags origin ${{ github.base_ref }}

      - name: Compare findings against the merge base
        # Both baselines are far too large to require a clean run (2081 ruff,
        # 677 mypy at the time of writing), so this fails only on findings the
        # change itself introduces. See .github/scripts/lint_delta.py.
        run: python .github/scripts/lint_delta.py --base-ref origin/${{ github.base_ref }}
