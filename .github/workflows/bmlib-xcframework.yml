name: bmlib xcframework

permissions:
  contents: read

# Rebuilds BmlibFFI.xcframework and its Swift and Kotlin bindings from the bmlib
# commit BmlibFFI.pin.json names, and fails unless they and the committed
# xcframework match the pin (#583). A committed binary is checked, not trusted.
#
# The committed copy is this job's own build. Byte-identity needs the same
# rustc *and* the same Apple linker, so a copy built on a developer's Mac never
# matches a runner's. To re-pin:
#   1. set bmlibCommit (and rustc, if it moves) in the pin, on a PR branch;
#   2. this workflow's run on that PR fails and uploads `bmlib-xcframework`;
#   3. unpack its xcframework.tgz: BmlibFFI.xcframework (with each slice's
#      dSYMs/, which .gitignore re-includes, #752) into
#      Packages/BioMedLit/Frameworks, Swift/bmlib_ffi.swift into
#      Packages/BioMedLit/Sources/BmlibCore, Kotlin/bmlib_ffi.kt into
#      android/MedicalFactChecker/app/src/main/java/org/bmlib/ffi; copy
#      treeSha256 and xcode from its build.json into the pin.
# When a runner image moves to another Xcode, this fails on an unchanged pin;
# the log names both Xcode versions, and steps 2 and 3 re-pin.
#
# Deliberately NOT filtered by `paths:` (HANDOVER: no job gains one). No
# workflow_dispatch: a manual run would build the pinned code with the default
# branch's privileges and write the cache later runs restore (CodeQL's cache
# poisoning alert on PR #588); a re-pin is a PR anyway.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: bmlib-xcframework-${{ github.ref }}
  cancel-in-progress: true

env:
  PIN: Packages/BioMedLit/Frameworks/BmlibFFI.pin.json

jobs:
  rebuild:
    name: Rebuild from the pin and compare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the pin
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          pin = json.load(open(os.environ["PIN"]))
          print(f"commit={pin['bmlibCommit']}")
          print(f"rustc={pin['rustc']}")
          print(f"xcode={pin.get('xcode', 'none recorded')}")
          PY

      - name: Check out bmlib at the pinned commit
        uses: actions/checkout@v4
        with:
          # hherb/bmlib is public, so no token is needed.
          repository: hherb/bmlib
          ref: ${{ steps.pin.outputs.commit }}
          path: bmlib-checkout

      - name: Install the pinned Rust
        run: |
          rustup toolchain install "${{ steps.pin.outputs.rustc }}" --profile minimal \
            --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          rustup override set "${{ steps.pin.outputs.rustc }}" --path bmlib-checkout/rust

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            bmlib-checkout/rust/target
          key: bmlib-xcframework-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.rustc }}

      - name: Build
        working-directory: bmlib-checkout/rust
        run: bmlib-ffi/scripts/build-xcframework.sh "$RUNNER_TEMP/xcf"

      - name: Package the build
        run: |
          set -o pipefail
          # From the unstripped host build the script left behind, inside bmlib's
          # workspace (library mode finds uniffi.toml through cargo metadata).
          # --no-format, so ktlint's presence does not change the bytes.
          (cd bmlib-checkout/rust && target/release/uniffi-bindgen generate --no-format \
            --library target/release/libbmlib_ffi.dylib \
            --language kotlin --out-dir "$RUNNER_TEMP/kt")
          mkdir "$RUNNER_TEMP/xcf/Kotlin"
          cp "$RUNNER_TEMP/kt/org/bmlib/ffi/bmlib_ffi.kt" "$RUNNER_TEMP/xcf/Kotlin/"
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          hash="$(python3 .github/scripts/xcframework_tree_sha256.py "$RUNNER_TEMP/xcf/BmlibFFI.xcframework")"
          printf '{"treeSha256": "%s", "xcode": "%s"}\n' "$hash" "$xcode" > "$RUNNER_TEMP/xcf/build.json"
          cat "$RUNNER_TEMP/xcf/build.json"
          # A tarball, because upload-artifact drops the macOS slice's symlinks.
          tar -czf "$RUNNER_TEMP/xcframework.tgz" -C "$RUNNER_TEMP/xcf" .

      - uses: actions/upload-artifact@v4
        with:
          name: bmlib-xcframework
          path: ${{ runner.temp }}/xcframework.tgz
          retention-days: 14

      - name: Compare with the committed xcframework and bindings
        run: |
          status=0
          python3 .github/scripts/xcframework_tree_sha256.py \
            "$RUNNER_TEMP/xcf/BmlibFFI.xcframework" --check "$PIN" || status=1
          python3 .github/scripts/xcframework_tree_sha256.py \
            Packages/BioMedLit/Frameworks/BmlibFFI.xcframework --check "$PIN" || status=1
          diff -u Packages/BioMedLit/Sources/BmlibCore/bmlib_ffi.swift \
            "$RUNNER_TEMP/xcf/Swift/bmlib_ffi.swift" || status=1
          # UniFFI's checksums leave out record fields, so a stale .kt can pass
          # Android's FFI test and misread a record at runtime.
          diff -u android/MedicalFactChecker/app/src/main/java/org/bmlib/ffi/bmlib_ffi.kt \
            "$RUNNER_TEMP/xcf/Kotlin/bmlib_ffi.kt" || status=1
          if [ "$status" != 0 ]; then
            echo "::error::The rebuild differs from what is committed. The pin was built with Xcode" \
              "${{ steps.pin.outputs.xcode }}, this runner has $(xcodebuild -version | sed -n 1p)." \
              "Re-pin from this run's bmlib-xcframework artifact (see the comment at the top of this workflow)."
          fi
          exit "$status"
