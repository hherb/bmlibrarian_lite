name: Android tests

permissions:
  contents: read

# Deliberately NOT filtered by `paths:`, for the same reason as python-tests.yml.
#
# The transparency parity assertions in
# android/.../domain/transparency/TransparencyParityTest.kt read the shared fixtures
# in doc/cross_platform/transparency_parity/, which live outside android/. A paths
# filter listing only android/ would skip this run for a contract-only edit — the
# silent pass the parity suite exists to prevent.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # In the cache key too, so a bump is not shadowed by a cached older binary.
  CARGO_NDK_VERSION: 3.5.4

jobs:
  unit-tests:
    name: Gradle unit tests
    runs-on: ubuntu-latest
    # The suite runs in a few minutes; without a limit a hung test would hold the
    # runner for GitHub's six-hour default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/MedicalFactChecker
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # bmlib's Rust library through UniFFI (#583): Gradle builds it from a bmlib
      # checkout at BmlibFFI.pin.json's commit (its checkBmlibPin refuses any
      # other), so the bmlib FFI tests run against the committed Kotlin bindings.
      - name: Read the bmlib pin
        id: pin
        working-directory: .
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("Packages/BioMedLit/Frameworks/BmlibFFI.pin.json"))
          print(f"commit={pin['bmlibCommit']}")
          print(f"rustc={pin['rustc']}")
          PY

      - name: Check out bmlib at the pinned commit
        uses: actions/checkout@v4
        with:
          # hherb/bmlib is public, so no token is needed.
          repository: hherb/bmlib
          ref: ${{ steps.pin.outputs.commit }}
          path: bmlib-checkout

      - name: The retraction contract copy is the pinned bmlib's
        # Swift and Kotlin assert the pin's Rust against this copy; a stale or cut copy would pass.
        working-directory: .
        run: |
          cmp doc/cross_platform/retraction_parity/retraction_status.json \
            bmlib-checkout/tests/fixtures/retraction_status.json \
            || { echo "::error::retraction_status.json differs from bmlib at the FFI pin"; exit 1; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            bmlib-checkout/rust/target
          key: bmlib-android-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.rustc }}-ndk${{ env.CARGO_NDK_VERSION }}

      - name: Install the pinned Rust and cargo-ndk
        working-directory: .
        run: |
          rustup toolchain install "${{ steps.pin.outputs.rustc }}" --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          rustup override set "${{ steps.pin.outputs.rustc }}" --path bmlib-checkout/rust
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Run unit tests
        env:
          BMLIB_DIR: ${{ github.workspace }}/bmlib-checkout
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: The bmlib FFI tests ran
        # They skip themselves without the host library, which would pass silently.
        run: |
          for test in util.jats.BmlibJatsFfiTest util.retraction.BmlibRetractionContractTest \
              util.retraction.RetractionCheckerTest util.retraction.RetractionCrossrefLookupTest \
              util.retraction.RetractionIndexStoreTest util.retraction.RetractionTextTest; do
            report=app/build/test-results/testDebugUnitTest/TEST-com.bmlibrarian.factchecker.$test.xml
            grep -q 'skipped="0"' "$report" && ! grep -q 'tests="0"' "$report" \
              || { echo "::error::$test did not run"; head -3 "$report"; exit 1; }
          done

      - name: Upload test reports
        # Gradle's HTML report is the only place the individual failure messages
        # survive, and the log above truncates them.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/MedicalFactChecker/app/build/reports/tests/
          retention-days: 7
