<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5BA8"/>
      <stop offset="100%" style="stop-color:#1A3A6E"/>
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F0FF"/>
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGradient)"/>

  <!-- Medical cross -->
  <g filter="url(#shadow)">
    <!-- Vertical bar of cross -->
    <rect x="412" y="180" width="200" height="500" rx="24" ry="24" fill="url(#crossGradient)"/>
    <!-- Horizontal bar of cross -->
    <rect x="262" y="330" width="500" height="200" rx="24" ry="24" fill="url(#crossGradient)"/>
  </g>

  <!-- Checkmark circle background -->
  <circle cx="700" cy="700" r="180" fill="url(#checkGradient)" filter="url(#shadow)"/>

  <!-- White checkmark -->
  <path d="M 590 700 L 660 770 L 810 600"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Subtle document/paper element behind cross -->
  <g opacity="0.15">
    <rect x="320" y="520" width="280" height="360" rx="16" ry="16" fill="#FFFFFF"/>
    <line x1="360" y1="580" x2="560" y2="580" stroke="#FFFFFF" stroke-width="12"/>
    <line x1="360" y1="640" x2="520" y2="640" stroke="#FFFFFF" stroke-width="12"/>
    <line x1="360" y1="700" x2="540" y2="700" stroke="#FFFFFF" stroke-width="12"/>
    <line x1="360" y1="760" x2="480" y2="760" stroke="#FFFFFF" stroke-width="12"/>
  </g>
</svg>
